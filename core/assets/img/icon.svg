<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- canguro: sagoma composta -->
  <g fill="#231402">
    <!-- orecchie arrotondate -->
    <ellipse cx="186" cy="102" rx="13" ry="36" transform="rotate(-16 186 102)"/>
    <ellipse cx="234" cy="98" rx="13" ry="34" transform="rotate(14 234 98)"/>
    <!-- testa -->
    <ellipse cx="206" cy="148" rx="37" ry="32"/>
    <!-- muso orizzontale -->
    <path d="M176 140 C 154 146, 136 158, 128 172 C 144 178, 170 180, 188 172 Z"/>
    <!-- collo -->
    <path d="M198 168 L278 206 L242 238 L186 188 Z"/>
    <!-- torso -->
    <ellipse cx="272" cy="274" rx="66" ry="88" transform="rotate(22 272 274)"/>
    <!-- anca -->
    <circle cx="306" cy="338" r="58"/>
    <!-- coscia + gamba -->
    <ellipse cx="272" cy="374" rx="48" ry="36"/>
    <!-- piede -->
    <rect x="176" y="392" width="126" height="30" rx="15"/>
    <!-- piede dietro -->
    <rect x="206" y="372" width="104" height="24" rx="12"/>
    <!-- zampa anteriore (braccio) -->
    <path d="M244 234 C 224 260, 204 280, 194 300" stroke="#231402" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="193" cy="301" r="17"/>
  </g>

  <!-- occhio -->
  <circle cx="200" cy="140" r="6.5" fill="#ffb347"/>

  <!-- cacciavite impugnato dalla zampa -->
  <g transform="translate(196,296) rotate(35)">
    <rect x="-14" y="-10" width="28" height="66" rx="13" fill="#d00000"/>
    <rect x="-9" y="56" width="18" height="54" rx="4" fill="#d9d9d9"/>
    <path d="M-9 110 L9 110 L0 126 Z" fill="#8d8d8d"/>
    <rect x="-16" y="-14" width="32" height="12" rx="6" fill="#8d0801"/>
  </g>

  <!-- coda -->
  <path d="M322 324 C 402 372, 452 356, 470 300" stroke="#231402" stroke-width="46" stroke-linecap="round" fill="none"/>
</svg>
